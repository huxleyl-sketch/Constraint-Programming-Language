<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <title>test</title>
    <style>
        body { font-family: monospace; background-color: #f4f4f4; }
        .console-container {
            width: 80%;
            margin: 20px auto;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff;
        }
        #console-output {
            font-family: monospace;
            height: 200px;
            overflow-y: scroll;
            border-bottom: 1px solid #ccc;
            padding: 5px;
            background-color: #f1f1f1;
            color: rgb(33, 33, 33); /* Green text like a classic console */
        }
        #console-input {
            font-family: monospace;
            width: calc(100% - 12px);
            padding: 5px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }
        #output {
            font-family: monospace;
            width: calc(100% - 12px);
            padding: 5px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }
    </style>
 </head>
 <body>
    <label for="algorithm">Choose a solving algorithm:</label>
    <select id="algorithm">
        <option value="">Select an algorithm?</option>
        <option value="dfs">DFS ? depth-first search</option>
        <option value="mac">MAC ? search with arc consistency</option>
    </select>
    <br>
    <label for="fileInput">Upload .csp file: </label>
    <input 
        type="file" 
        id="fileInput"
        accept=".csp"
    />
    <label>Import folder <input type="file" id="dependencyInput" webkitdirectory multiple /></label>
    <button id="save-button">Save Current File</button>
    <pre id="output" contenteditable="true"></pre>

    <div class="console-container">
        <div id="console-output"></div>
        <button id="solve-button">Solve</button>
        <button id="next-button">Next solution</button>
        <button id="stop-button">Stop</button>
        <input type="text" id="console-input" placeholder="Enter code and press Enter...">
    </div>

    <script src="dist/src/tokeniser.js"></script>
    <script src="dist/src/parser.js"></script>
    <script src="dist/src/predicateSolverExpr.js"></script>
    <script src="dist/src/constraintSystem.js"></script>
    <script src="dist/src/algorithms/dfs.js"></script>
    <script src="dist/src/algorithms/AC-3.js"></script>
    <script src="dist/src/algorithms/MAC.js"></script>
    <script src="dist/src/main.js"></script>
    <script src="dist/src/solutionSession.js"></script>
    <script src="dist/src/content.js"></script>
</body>
